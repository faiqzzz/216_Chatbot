<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Workspace — Monochrome Glass</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Latar cahaya monokrom untuk pantulan kaca -->
    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="app-shell">
        <header class="topbar">
            <div class="brand-group">
                <div class="glass-badge">AI</div>
                <div class="brand-info">
                    <span class="brand-title">MONOCHROME GLASS</span>
                    <span class="brand-sub" id="statusText">Siap menerima instruksi</span>
                </div>
            </div>
            <div class="header-actions">
                <span class="status-indicator" id="statusDot" title="Status Koneksi"></span>
                <button type="button" id="clearBtn" class="btn-reset">Bersihkan</button>
            </div>
        </header>

        <main class="chat-feed" id="chatFeed">
            <div class="empty-state" id="emptyState">
                <h2>Mulai Sesi Baru</h2>
                <p>Tanyakan apa saja, tulis kode, atau diskusikan ide dalam ruang kerja monokrom.</p>
                <div class="shortcut-hint">
                    <span><kbd>Enter</kbd> Kirim</span>
                    <span><kbd>Shift</kbd> + <kbd>Enter</kbd> Baris baru</span>
                </div>
            </div>
        </main>

        <footer class="composer-wrapper">
            <form id="chatForm" class="composer-box">
                <textarea 
                    id="promptInput" 
                    rows="1" 
                    placeholder="Ketik pesan di sini..." 
                    required
                ></textarea>
                <button type="submit" id="sendBtn" aria-label="Kirim Pesan">
                    <span>Kirim</span>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                </button>
            </form>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
